format = """
$username[ \u203a ](#2A5A80)$directory$git_branch$git_status$python$nodejs
$character"""
right_format = """$cmd_duration$status$time"""
add_newline = true

[username]
show_always = true
style_user = "bold #4FB3D9"
style_root = "bold #FF6B6B"
format = "[$user]($style)"

[directory]
style = "#DFF6FF"
format = "[$path]($style)[$read_only]($read_only_style) "
truncation_length = 4
truncation_symbol = "\u2026 \u203a "
home_symbol = "~"

[directory.substitutions]
"\\" = " \u203a "
"/" = " \u203a "

[git_branch]
symbol = "\ue725 "
style = "#5FD7FF"
format = "[ $symbol$branch]($style)"

[git_status]
style = "#F0C674"
format = "[( $all_status$ahead_behind)]($style) "

[python]
style = "#2A8FD0"
format = "[ \ue73c $version]($style)"

[nodejs]
style = "#2A8FD0"
format = "[ \ue718 $version]($style)"

[cmd_duration]
min_time = 2000
style = "#F0C674"
format = "[took $duration  ]($style)"

[status]
disabled = false
success_symbol = "\u2714"
symbol = "\u2718 $status"
success_style = "#7DDC8C"
style = "#FF6B6B"
format = "[$symbol  ]($style)"

[time]
disabled = false
time_format = "%H:%M"
style = "#2A5A80"
format = "[\uf017 $time]($style)"

[character]
success_symbol = "[\u276f](bold #5FD7FF)"
error_symbol = "[\u276f](bold #FF6B6B)"